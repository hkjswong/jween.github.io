<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - 聯絡我們</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
      color: #333;
    }
    .container {
      max-width: 700px;
      margin: 60px auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #222;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 40px;
    }
    .info {
      line-height: 1.8;
      font-size: 16px;
    }
    .info p {
      margin: 12px 0;
    }
    .label {
      font-weight: bold;
      color: #444;
      display: inline-block;
      width: 90px;
    }
    a {
      color: #2563eb;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 40px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Contact Us</h1>
    <p class="subtitle">聯絡我們</p>

    <div class="info">
      <p><span class="label">電子郵件：</span> <a href="mailto:你的郵箱@example.com">你的郵箱@example.com</a></p>
      <p><span class="label">電話：</span> +852 1234 5678</p>
      <p><span class="label">地址：</span> 香港某處</p>
      <p><span class="label">工作時間：</span> 星期一至五 10:00 - 18:00</p>
    </div>

    <a href="index.html" class="back">← 返回首頁</a>
  </div>
</body>
</html>
