<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Earth 地球</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <!-- 嵌入 Google Earth（預設視角：地球） -->
  <iframe 
    src="https://earth.google.com/web/@0,0,20000000a,35y,0h,0t,0r/data=!3m1!1e3&embedded=true"
    allowfullscreen
    loading="lazy"
    title="Google Earth 地球">
  </iframe>
</body>
</html>
