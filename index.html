<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界時間</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", -apple-system, sans-serif;
      background: #fff;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .main-time {
      font-size: clamp(3.8rem, 14vw, 7.5rem);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 8px;
    }
    .date {
      font-size: 1.25rem;
      color: #555;
      margin-bottom: 40px;
    }
    .cities {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      max-width: 920px;
    }
    .city {
      background: #f4f4f4;
      padding: 12px 18px;
      border-radius: 8px;
      text-align: center;
      min-width: 105px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    .city:hover {
      background: #e8e8e8;
    }
    .city.active {
      background: #e0e0e0;
      border-color: #999;
      font-weight: 600;
    }
    .city-name {
      font-size: 0.88rem;
      color: #666;
      margin-bottom: 3px;
    }
    .city-time {
      font-size: 1.25rem;
      font-weight: 600;
    }
    .tip {
      margin-top: 30px;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="main-time" id="mainTime">--:--:--</div>
  <div class="date" id="mainDate">載入中...</div>

  <div class="cities" id="cities">
    <!-- 城市会通过JS生成 -->
  </div>

  <div class="tip">點擊下方城市可切換主時間顯示</div>

  <script>
    const cities = [
      { name: '洛杉磯', timezone: 'America/Los_Angeles', id: 'la' },
      { name: '紐約', timezone: 'America/New_York', id: 'ny' },
      { name: '倫敦', timezone: 'Europe/London', id: 'london' },
      { name: '巴黎', timezone: 'Europe/Paris', id: 'paris' },
      { name: '北京', timezone: 'Asia/Shanghai', id: 'beijing' },
      { name: '香港', timezone: 'Asia/Hong_Kong', id: 'hk' },
      { name: '東京', timezone: 'Asia/Tokyo', id: 'tokyo' },
      { name: '悉尼', timezone: 'Australia/Sydney', id: 'sydney' }
    ];

    let currentTimezone = 'Asia/Tokyo';
    let currentCityName = '東京';

    // 生成城市按钮
    const citiesContainer = document.getElementById('cities');
    cities.forEach(city => {
      const div = document.createElement('div');
      div.className = 'city' + (city.timezone === currentTimezone ? ' active' : '');
      div.innerHTML = `
        <div class="city-name">${city.name}</div>
        <div class="city-time" id="${city.id}">--:--</div>
      `;
      div.onclick = () => {
        currentTimezone = city.timezone;
        currentCityName = city.name;
        document.querySelectorAll('.city').forEach(c => c.classList.remove('active'));
        div.classList.add('active');
        updateTime();
      };
      citiesContainer.appendChild(div);
    });

    function updateTime() {
      const now = new Date();

      // 主时间
      const timeOptions = { timeZone: currentTimezone, hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' };
      document.getElementById('mainTime').textContent = now.toLocaleTimeString('zh-TW', timeOptions);

      // 日期
      const dateOptions = { timeZone: currentTimezone, year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('mainDate').textContent = `${currentCityName}　${now.toLocaleDateString('zh-TW', dateOptions)}`;

      // 更新所有城市时间
      cities.forEach(city => {
        const el = document.getElementById(city.id);
        if (el) {
          el.textContent = now.toLocaleTimeString('zh-TW', {
            timeZone: city.timezone,
            hour12: false,
            hour: '2-digit',
            minute: '2-digit'
          });
        }
      });
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
